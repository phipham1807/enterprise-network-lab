
name: enterprise

topology:
  nodes:
    r1:
      kind: linux
      image: quay.io/frrouting/frr:containerlab-10.7.1
      binds:
        - ../configs/r1/daemons:/etc/frr/daemons
        - ../configs/r1/frr.conf:/etc/frr/frr.conf
      exec:
        - ip link set lo up
        - ip link set eth1 up
        - ip link set eth2 up
        - ip link set eth3 up
        - ip link set eth4 up

    r2:
      kind: linux
      image: quay.io/frrouting/frr:containerlab-10.7.1
      binds:
        - ../configs/r2/daemons:/etc/frr/daemons
        - ../configs/r2/frr.conf:/etc/frr/frr.conf
      exec:
        - ip link set lo up
        - ip link set eth1 up
        - ip link set eth2 up
        - ip link set eth3 up

    r3:
      kind: linux
      image: quay.io/frrouting/frr:containerlab-10.7.1
      binds:
        - ../configs/r3/daemons:/etc/frr/daemons
        - ../configs/r3/frr.conf:/etc/frr/frr.conf
      exec:
        - ip link set lo up
        - ip link set eth1 up
        - ip link set eth2 up
        - ip link set eth3 up

    r4:
      kind: linux
      image: quay.io/frrouting/frr:containerlab-10.7.1
      binds:
        - ../configs/r4/daemons:/etc/frr/daemons
        - ../configs/r4/frr.conf:/etc/frr/frr.conf
      exec:
        - ip link set lo up
        - ip link set eth1 up
        - ip link set eth2 up

    r5:
      kind: linux
      image: quay.io/frrouting/frr:containerlab-10.7.1
      binds:
        - ../configs/r5/daemons:/etc/frr/daemons
        - ../configs/r5/frr.conf:/etc/frr/frr.conf
      exec:
        - ip link set lo up
        - ip link set eth1 up

    server:
      kind: linux
      image: alpine:3.22
      exec:
        - ip link set eth1 up
        - ip addr add 10.10.10.10/24 dev eth1
        - ip route replace default via 10.10.10.1

    pc-a:
      kind: linux
      image: alpine:3.22
      exec:
        - ip link set eth1 up
        - ip addr add 10.10.20.10/24 dev eth1
        - ip route replace default via 10.10.20.1

    pc-b:
      kind: linux
      image: alpine:3.22
      exec:
        - ip link set eth1 up
        - ip addr add 10.10.30.10/24 dev eth1
        - ip route replace default via 10.10.30.1

  links:
    - endpoints: ["r1:eth1", "r2:eth1"]
    - endpoints: ["r1:eth2", "r3:eth1"]
    - endpoints: ["r2:eth2", "r4:eth1"]
    - endpoints: ["r4:eth2", "r3:eth2"]
    - endpoints: ["r1:eth3", "r5:eth1"]
    - endpoints: ["r1:eth4", "server:eth1"]
    - endpoints: ["r2:eth3", "pc-a:eth1"]
    - endpoints: ["r3:eth3", "pc-b:eth1"]
