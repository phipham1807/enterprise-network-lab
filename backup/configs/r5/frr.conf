frr version 10.7
frr defaults traditional
hostname R5
service integrated-vtysh-config
!
interface lo
 ip address 10.255.0.5/32
!
interface eth1
 ip address 172.16.15.2/30
!
router ospf
 ospf router-id 10.255.0.5
 passive-interface default
 no passive-interface eth1
 network 10.255.0.5/32 area 0.0.0.0
 network 172.16.15.0/30 area 0.0.0.0
!
line vty
!
