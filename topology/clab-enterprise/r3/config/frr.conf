frr version 10.7.1_git
frr defaults traditional
hostname r3
domainname localdomain
service integrated-vtysh-config
!
interface eth1
 ip address 172.16.13.2/30
 ip ospf network point-to-point
 no ip ospf passive
exit
!
interface eth2
 ip address 172.16.34.2/30
 no ip ospf passive
exit
!
interface eth3
 ip address 10.10.30.1/24
exit
!
interface lo
 ip address 10.255.0.3/32
exit
!
router ospf
 ospf router-id 10.255.0.3
 passive-interface default
 network 10.10.30.0/24 area 0.0.0.0
 network 10.255.0.3/32 area 0.0.0.0
 network 172.16.13.0/30 area 0.0.0.0
 network 172.16.34.0/30 area 0.0.0.0
exit
!
