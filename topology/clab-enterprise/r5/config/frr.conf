frr version 10.7.1_git
frr defaults traditional
hostname r5
domainname localdomain
service integrated-vtysh-config
!
route-map PERMIT_ALL permit 10
exit
!
interface eth1
 ip address 172.16.15.2/30
 no ip ospf passive
exit
!
interface lo
 ip address 10.255.0.5/32
 ip address 203.0.113.1/24
exit
!
router bgp 65005
 neighbor 172.16.15.1 remote-as 65001
 !
 address-family ipv4 unicast
  network 203.0.113.0/24
  neighbor 172.16.15.1 route-map PERMIT_ALL in
  neighbor 172.16.15.1 route-map PERMIT_ALL out
 exit-address-family
exit
!
router ospf
 ospf router-id 10.255.0.5
 passive-interface default
 network 10.255.0.5/32 area 0.0.0.0
 network 172.16.15.0/30 area 0.0.0.0
exit
!
