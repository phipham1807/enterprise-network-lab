frr version 10.7
frr defaults traditional
hostname R5
service integrated-vtysh-config
!
interface lo
 ip address 10.255.0.5/32
 ip address 203.0.113.1/24
!
interface eth1
 ip address 172.16.15.2/30
!
router bgp 65005
 bgp router-id 10.255.0.5
 neighbor 172.16.15.1 remote-as 65001
 address-family ipv4 unicast
  network 203.0.113.0/24
  neighbor 172.16.15.1 route-map ALLOW-R1 in
  neighbor 172.16.15.1 route-map ALLOW-R1 out
 exit-address-family
!
route-map ALLOW-R1 permit 10
!
line vty
!
