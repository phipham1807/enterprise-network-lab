frr version 10.7.1_git
frr defaults traditional
hostname r1
domainname localdomain
service integrated-vtysh-config
!
ip prefix-list BGP-TO-OSPF seq 10 permit 203.0.113.0/24
ip prefix-list LAN-TO-R5 seq 10 permit 10.10.20.0/24
ip prefix-list LAN-TO-R5 seq 20 permit 10.10.30.0/24
!
route-map BGP-TO-OSPF permit 10
 match ip address prefix-list BGP-TO-OSPF
exit
!
route-map LAN-TO-R5 permit 10
 match ip address prefix-list LAN-TO-R5
exit
!
route-map ALLOW-R5 permit 10
exit
!
interface eth1
 ip address 172.16.12.1/30
 no ip ospf passive
exit
!
interface eth2
 ip address 172.16.13.1/30
 no ip ospf passive
exit
!
interface eth3
 ip address 172.16.15.1/30
exit
!
interface eth4
 ip address 10.10.10.1/24
exit
!
interface lo
 ip address 10.255.0.1/32
exit
!
router bgp 65001
 bgp router-id 10.255.0.1
 neighbor 172.16.15.2 remote-as 65005
 !
 address-family ipv4 unicast
  network 10.10.20.0/24
  network 10.10.30.0/24
  neighbor 172.16.15.2 route-map ALLOW-R5 in
  neighbor 172.16.15.2 route-map PERMIT_ALL out
 exit-address-family
exit
!
router ospf
 ospf router-id 10.255.0.1
 redistribute bgp route-map BGP-TO-OSPF
 passive-interface default
 network 10.10.10.0/24 area 0.0.0.0
 network 10.255.0.1/32 area 0.0.0.0
 network 172.16.12.0/30 area 0.0.0.0
 network 172.16.13.0/30 area 0.0.0.0
exit
!
