frr version 10.7
frr defaults traditional
hostname R2
service integrated-vtysh-config
!
interface lo
 ip address 10.255.0.2/32
!
interface eth1
 ip address 172.16.12.2/30
!
interface eth2
 ip address 172.16.24.1/30
!
interface eth3
 ip address 10.10.20.1/24
!
router ospf
 ospf router-id 10.255.0.2
 passive-interface default
 no passive-interface eth1
 no passive-interface eth2
 network 10.255.0.2/32 area 0.0.0.0
 network 172.16.12.0/30 area 0.0.0.0
 network 172.16.24.0/30 area 0.0.0.0
 network 10.10.20.0/24 area 0.0.0.0
!
line vty
!
