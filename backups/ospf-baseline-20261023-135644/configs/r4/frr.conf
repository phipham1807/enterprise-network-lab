frr version 10.7
frr defaults traditional
hostname R4
service integrated-vtysh-config
!
interface lo
 ip address 10.255.0.4/32
!
interface eth1
 ip address 172.16.24.2/30
!
interface eth2
 ip address 172.16.34.1/30
!
router ospf
 ospf router-id 10.255.0.4
 passive-interface default
 no passive-interface eth1
 no passive-interface eth2
 network 10.255.0.4/32 area 0.0.0.0
 network 172.16.24.0/30 area 0.0.0.0
 network 172.16.34.0/30 area 0.0.0.0
!
line vty
!
